<header class="site-header">
    <div class="container site-header__inner">
      <a href="{{ prefixo }}en/index.html" class="logo">
        <img class="logo-marca logo-marca--header"
             src="{{ prefixo }}assets/fukuoka-dental-clinic-escura.svg"
             alt="{{ site_nome }}" width="1372" height="372" decoding="async">
      </a>
      <div class="menu-lateral" id="menu-lateral">
        <button class="menu-lateral__fechar" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ prefixo }}en/about.html">About</a>
          <a href="{{ prefixo }}en/treatments.html">Treatments</a>
          <a href="{{ prefixo }}en/testimonials.html">Reviews</a>
          <a href="{{ prefixo }}en/blog/index.html">Blog</a>
          <a href="{{ prefixo }}en/japanese-speaking-dentist.html" lang="ja">日本語</a>
          <a href="{{ prefixo }}en/contact.html">Contact</a>
        </nav>
        <a class="btn btn--primary menu-lateral__cta" href="{{ site_whatsapp_url }}" target="_blank" rel="noopener">Book an appointment</a>
      </div>
      <div class="site-header__acoes">
        <nav class="lang-switch" aria-label="Language">
          <a href="{{ prefixo }}index.html" hreflang="pt-BR" {{ ativo_pt }}>PT</a>
          <a href="{{ prefixo }}en/index.html" hreflang="en" {{ ativo_en }}>EN</a>
        </nav>
        {{ cta_bar }}
        <button class="nav-toggle" type="button" aria-controls="menu-lateral" aria-expanded="false" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div class="menu-overlay"></div>
  </header>
